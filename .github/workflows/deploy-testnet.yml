name: Deploy to Sepolia

on:
  workflow_dispatch:
    inputs:
      initialRecipient:
        description: 'Initial recipient address'
        required: false
      initialSupply:
        description: 'Initial supply in ether (e.g. 1000000)'
        required: false
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'script/**'
      - 'foundry.toml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install deps
        run: |
          forge install foundry-rs/forge-std --no-git

      - name: Build
        run: forge build

      - name: Deploy
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          INITIAL_RECIPIENT: ${{ inputs.initialRecipient || '' }}
          INITIAL_SUPPLY: ${{ inputs.initialSupply && format('{}_000000000000000000', inputs.initialSupply) || '' }}
        run: |
          set -euxo pipefail
          forge script script/DeployC10Y.s.sol:DeployC10Y \
            --rpc-url "$SEPOLIA_RPC_URL" \
            --broadcast -vvvv --verify || forge script script/DeployC10Y.s.sol:DeployC10Y \
            --rpc-url "$SEPOLIA_RPC_URL" \
            --broadcast -vvvv

      - name: Extract deployment
        id: extract
        run: |
          set -euo pipefail
          RUN_JSON=$(ls -t broadcast/DeployC10Y.s.sol/*/run-latest.json | head -n1)
          ADDR=$(jq -r '.transactions[] | select(.contractName=="C10Y").contractAddress' "$RUN_JSON" | tail -n1)
          echo "address=$ADDR" >> $GITHUB_OUTPUT

      - name: Generate deployment.json for dApp
        run: |
          mkdir -p docs
          echo '{' > docs/deployment.json
          echo '  "name": "C10Y",' >> docs/deployment.json
          echo '  "address": "'${{ steps.extract.outputs.address }}'",' >> docs/deployment.json
          echo '  "chainId": 11155111,' >> docs/deployment.json
          echo '  "abi": ' >> docs/deployment.json
          jq '.abi' out/C10Y.sol/C10Y.json >> docs/deployment.json
          echo '}' >> docs/deployment.json

      - name: Commit deployment.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update docs/deployment.json with latest Sepolia deploy"
          file_pattern: docs/deployment.json
