[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]

solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# Set your RPCs in .env and reference via: ${MAINNET_RPC_URL}
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
holesky = "${HOLESKY_RPC_URL}"

[fmt]
line_length = 100
bracket_spacing = true
multiline_func_header = "params_first"

[etherscan]
# Optional: set keys in .env as ETHERSCAN_API_KEY, BASESCAN_API_KEY, etc.
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
